[project]
name = "CS_fibonacci-tdd-kata"
version = "0.1.0"
description = "A TDD kata: Fibonacci, from notebook exploration to a tested, published package"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Salwa Azariouh", email = "salwaazariouh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fibonacci_tdd_kata"

[project.scripts]
fibonacci-tdd-kata = "fibonacci_tdd_kata:main"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# ---- Adding ruff checks
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear

[tool.ruff.lint.per-file-ignores]
# marimo cells intentionally end on a bare expression to define what the cell displays — that pattern is exactly what flake8-bugbear's B018# ("useless expression") flags, so it's disabled for notebook files.
"notebook/*.py" = ["B018"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90
# ---- ruff checks
